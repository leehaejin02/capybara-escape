name: Deploy to GitHub Pages

# 배포 방식: gh-pages 브랜치 (legacy 경로).
#
# 원래는 actions/deploy-pages(GitHub Actions 소스) 방식이었으나, 이 저장소에서
# 배포가 5회 연속 deployment_queued 상태로 정체된 뒤 타임아웃했다.
# 확인한 것: 빌드 job 정상 / 워크플로 정상 / 브랜치 정책 main 허용 /
# Pages 서비스 operational / Settings의 Source도 GitHub Actions로 정상.
# 그럼에도 Pages status가 계속 null이라 사이트가 한 번도 생성되지 않았다.
# → 프로비저닝 경로가 다른 브랜치 배포로 전환한다. 상세는 WORKLOG 참조.
#
# 서드파티 액션은 쓰지 않는다 (공식 액션 + git만). 심사자 실행 가능성과
# 라이선스 추적 부담을 늘리지 않기 위해서다.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm run build는 scripts/check-boundary.mjs(src/sim 경계 검사)를
      # 선행 실행한다. 경계가 깨진 코드는 여기서 차단되어 배포되지 않는다.
      - name: Build
        run: npm run build

      - name: Publish to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Jekyll 처리를 끄지 않으면 밑줄로 시작하는 산출물이 누락될 수 있다.
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
